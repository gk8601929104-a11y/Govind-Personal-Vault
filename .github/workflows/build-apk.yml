name: Build signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govind-vault-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Find and extract current app source
        shell: bash
        run: |
          mapfile -t archives < <(find . -maxdepth 1 -type f \
            -name 'Govind_Personal_Vault_GitHub_Public_Repo_v*.zip' \
            -printf '%f\n' | sort -V)

          if [[ ${#archives[@]} -eq 1 ]]; then
            echo "Using source ZIP: ${archives[0]}"
            rm -rf extracted
            mkdir -p extracted
            unzip -q "${archives[0]}" -d extracted

            manifest="$(find extracted -type f \
              -path '*/app/src/main/AndroidManifest.xml' -print -quit)"
            [[ -n "$manifest" ]] || { echo "AndroidManifest.xml not found in ZIP." >&2; exit 1; }
            project_dir="${manifest%/app/src/main/AndroidManifest.xml}"
            echo "SOURCE_ARCHIVE=${archives[0]}" >> "$GITHUB_ENV"
          elif [[ -f "app/version.properties" && -f "app/src/main/AndroidManifest.xml" ]]; then
            echo "No ZIP found — using checked-out source tree at repository root."
            project_dir="."
            echo "SOURCE_ARCHIVE=source-tree" >> "$GITHUB_ENV"
          else
            echo "Keep exactly one public source ZIP in the repository, OR commit the full source tree (app/version.properties + AndroidManifest.xml)." >&2
            printf 'Found ZIPs: %s\n' "${archives[@]:-none}" >&2
            exit 1
          fi

          config="$project_dir/app/version.properties"
          [[ -f "$config" ]] || { echo "app/version.properties not found." >&2; exit 1; }

          # shellcheck disable=SC1090
          source "$config"
          : "${VERSION_CODE:?Missing VERSION_CODE}"
          : "${VERSION_NAME:?Missing VERSION_NAME}"
          : "${COMPILE_SDK:?Missing COMPILE_SDK}"
          : "${BUILD_TOOLS_VERSION:?Missing BUILD_TOOLS_VERSION}"
          : "${APK_BASENAME:?Missing APK_BASENAME}"

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "APK_BASENAME=$APK_BASENAME" >> "$GITHUB_ENV"
          chmod +x "$project_dir"/scripts/*.sh

      - name: Confirm Gradle version
        shell: bash
        run: gradle --version

      - name: Install Android SDK and audit tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS_VERSION"
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Verify repository safety
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./scripts/verify_repo_safe.sh

      - name: Restore private signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing SIGNING_KEYSTORE_BASE64 secret"
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/govind-personal-vault.jks"
          test -s "$RUNNER_TEMP/govind-personal-vault.jks"

      - name: Run tests and security checks
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./scripts/run_tests.sh
          ./scripts/security_audit.sh

      - name: Build and sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/govind-personal-vault.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./scripts/build_apk.sh

      - name: Verify final APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./scripts/verify_apk.sh

      - name: Upload APK for download
        uses: actions/upload-artifact@v7
        with:
          name: Govind-Personal-Vault-v${{ env.VERSION_NAME }}
          path: |
            ${{ env.PROJECT_DIR }}/dist/*.apk
            ${{ env.PROJECT_DIR }}/dist/*.apk.idsig
          if-no-files-found: error
          retention-days: 7

      - name: Write build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Govind Personal Vault APK ready"
            echo "- Version: $VERSION_NAME"
            echo "- Version code: $VERSION_CODE"
            echo "- Source: $SOURCE_ARCHIVE"
            echo "- Gradle: 9.5.0"
            echo "- Download it from the Artifacts section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/govind-personal-vault.jks"
