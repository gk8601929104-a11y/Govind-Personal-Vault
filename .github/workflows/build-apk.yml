name: Build signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govind-vault-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: extracted/Govind_Personal_Vault_GitHub_Repo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract app source
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Govind_Personal_Vault_GitHub_Public_Repo_v1.0.1.zip -d extracted
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          chmod +x "$PROJECT_DIR"/scripts/*.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install security-check tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Verify repository safety
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./scripts/verify_repo_safe.sh

      - name: Restore private signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing SIGNING_KEYSTORE_BASE64 secret"
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/govind-personal-vault.jks"
          test -s "$RUNNER_TEMP/govind-personal-vault.jks"

      - name: Run tests and security checks
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./scripts/run_tests.sh
          ./scripts/security_audit.sh

      - name: Build and sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/govind-personal-vault.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./scripts/build_apk.sh

      - name: Verify final APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./scripts/verify_apk.sh

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Govind-Personal-Vault-v1.0.1
          path: |
            extracted/Govind_Personal_Vault_GitHub_Repo/dist/Govind_Personal_Vault_v1.0.1.apk
            extracted/Govind_Personal_Vault_GitHub_Repo/dist/Govind_Personal_Vault_v1.0.1.apk.idsig
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/govind-personal-vault.jks"
